MEMORY {
  ZP:    start = $0000, size = $0100, type = rw;
  ROM0:  start = $008000, size = $4000, fill = yes, fillval = $FF, file = %O;
  GSU0:  start = $00C000, size = $0100, fill = yes, fillval = $01, file = %O;
  GSU1:  start = $00C100, size = $3EB0, fill = yes, fillval = $FF, file = %O;
  HDR:   start = $00FFB0, size = $0050, fill = yes, fillval = $00, file = %O;
  ROM1:  start = $018000, size = $8000, fill = yes, fillval = $FF, file = %O;
}
SEGMENTS {
  CODE:    load = ROM0, type = ro;
  GSUMAIN: load = GSU0, type = ro;
  GSURET:  load = GSU1, type = ro;
  HEADER:  load = HDR,  type = ro;
  DATA1:   load = ROM1, type = ro;
}
